version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: ai_pm_redis_prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_pm_prod_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_pm_backend_prod
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - ai_pm_prod_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_pm_celery_worker_prod
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    volumes:
      - ./backend/uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - ai_pm_prod_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_pm_celery_beat_prod
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    networks:
      - ai_pm_prod_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: ai_pm_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    networks:
      - ai_pm_prod_network

  nginx:
    image: nginx:alpine
    container_name: ai_pm_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ai_pm_prod_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  redis_data_prod:
  certbot_www:
  certbot_conf:

networks:
  ai_pm_prod_network:
    driver: bridge
