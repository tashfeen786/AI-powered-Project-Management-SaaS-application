<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus — AI Project Management</title>
<meta name="description" content="AI-powered project management for modern teams">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F8F9;--card:#ffffff;--primary:#4F46E5;--primary-h:#4338CA;--primary-10:rgba(79,70,229,.1);--primary-6:rgba(79,70,229,.06);
  --border:#E8E8EC;--border-strong:#D1D1D8;--text:#18181B;--muted:#71717A;--muted-light:#A1A1AA;
  --success:#16A34A;--success-bg:#F0FDF4;--success-border:#BBF7D0;
  --warning:#D97706;--warning-bg:#FFFBEB;--warning-border:#FDE68A;
  --danger:#DC2626;--danger-bg:#FEF2F2;--danger-border:#FECACA;
  --info:#2563EB;--info-bg:#EFF6FF;--info-border:#BFDBFE;
  --r:8px;--r-lg:12px;--sw:236px;--th:56px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 8px -2px rgba(0,0,0,.08),0 2px 4px -1px rgba(0,0,0,.04);
  --shadow-lg:0 12px 24px -4px rgba(0,0,0,.1),0 4px 8px -2px rgba(0,0,0,.06);
  --ease:.15s cubic-bezier(.4,0,.2,1);
  --font:'Inter',system-ui,-apple-system,sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a,button{cursor:pointer;font-family:inherit;text-decoration:none;color:inherit;border:none;background:none}
input,textarea,select{font-family:inherit;outline:none}
ul{list-style:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D4D4D8;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#A1A1AA}
.hidden{display:none!important}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:34px;border-radius:var(--r);font-size:13px;font-weight:500;white-space:nowrap;transition:all var(--ease);cursor:pointer;letter-spacing:-.01em}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.2),inset 0 1px 0 rgba(255,255,255,.12)}
.btn-primary:hover{background:var(--primary-h);box-shadow:0 3px 8px rgba(79,70,229,.3)}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow-xs)}
.btn-secondary:hover{background:#F4F4F6;border-color:var(--border-strong)}
.btn-ghost{color:var(--muted);border-radius:var(--r)}
.btn-ghost:hover{color:var(--text);background:#F4F4F6}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 1px 2px rgba(220,38,38,.2)}
.btn-danger:hover{background:#B91C1C}
.btn-lg{height:40px;padding:0 18px;font-size:14px;border-radius:var(--r)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-icon{width:34px;padding:0;justify-content:center}
/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:500;white-space:nowrap;letter-spacing:.01em}
.badge-default{background:#F4F4F6;color:#52525B;border:1px solid var(--border)}
.badge-primary{background:#EEF2FF;color:#4338CA;border:1px solid #C7D2FE}
.badge-success{background:var(--success-bg);color:#15803D;border:1px solid var(--success-border)}
.badge-warning{background:var(--warning-bg);color:#92400E;border:1px solid var(--warning-border)}
.badge-danger{background:var(--danger-bg);color:#991B1B;border:1px solid var(--danger-border)}
.badge-blue{background:var(--info-bg);color:#1D4ED8;border:1px solid var(--info-border)}
/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-xs)}
/* ── Forms ── */
.input{display:block;width:100%;height:38px;padding:0 12px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--text);font-size:14px;transition:border-color var(--ease),box-shadow var(--ease)}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-10)}
.input:hover:not(:focus){border-color:var(--border-strong)}
.input::placeholder{color:var(--muted-light)}
.label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text);letter-spacing:-.01em}
/* ── Avatar ── */
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;letter-spacing:.03em}
.avatar-sm{width:24px;height:24px;font-size:9px}
.avatar-lg{width:40px;height:40px;font-size:14px}
/* ── Progress ── */
.progress{height:6px;background:#F0F0F3;border-radius:9999px;overflow:hidden}
.progress-bar{height:100%;border-radius:9999px;background:var(--primary);transition:width .7s cubic-bezier(.4,0,.2,1)}
.progress-bar.success{background:var(--success)}
.progress-bar.warning{background:var(--warning)}
/* ── Divider ── */
.divider{height:1px;background:var(--border);margin:16px 0}
/* ── Login ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);position:fixed;inset:0;z-index:100}
#login-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 20% 40%,rgba(79,70,229,.06) 0%,transparent 70%),radial-gradient(ellipse 40% 40% at 80% 20%,rgba(124,58,237,.04) 0%,transparent 60%);pointer-events:none}
.login-wrap{width:100%;max-width:400px;padding:16px;position:relative}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:40px;box-shadow:var(--shadow-lg)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.login-logo-icon{width:36px;height:36px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3)}
.login-logo-name{font-size:18px;font-weight:700;letter-spacing:-.02em}
.login-title{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.03em}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:28px;line-height:1.5}
.form-group{margin-bottom:16px}
.social-btn{width:100%;height:38px;border:1.5px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;background:var(--card);cursor:pointer;transition:all var(--ease);margin-bottom:8px}
.social-btn:hover{background:#F4F4F6;border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow)}
.divider-text{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted-light);font-size:12px}
.divider-text::before,.divider-text::after{content:'';flex:1;height:1px;background:var(--border)}
.login-footer{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.login-footer a{color:var(--primary);font-weight:500}
.login-footer a:hover{color:var(--primary-h)}
