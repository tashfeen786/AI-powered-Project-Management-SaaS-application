version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: ai_pm_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_pm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_pm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_pm_network

  redis:
    image: redis:7-alpine
    container_name: ai_pm_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_pm_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_pm_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - ai_pm_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_pm_celery_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info"]
    volumes:
      - ./backend/uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - ai_pm_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_pm_celery_beat
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["celery", "-A", "app.core.celery_app.celery_app", "beat", "--loglevel=info"]
    networks:
      - ai_pm_network

  flower:
    image: mher/flower:3.0.1
    container_name: ai_pm_flower
    restart: always
    environment:
      - CELERY_BROKER_URL=${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    networks:
      - ai_pm_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/api/v1/ws}
    container_name: ai_pm_frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - ai_pm_network

  nginx:
    image: nginx:alpine
    container_name: ai_pm_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ai_pm_network

volumes:
  postgres_data:
  redis_data:

networks:
  ai_pm_network:
    driver: bridge
